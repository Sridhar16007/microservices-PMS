services:
  patient-service-db:
    image: mysql:latest
    container_name: patient-service-db

    ports:
      - "5000:3306"

    environment:
      MYSQL_DATABASE: patientdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: password

    volumes:
      - "E:/db_volumes/patient-service-db:/var/lib/mysql"

    networks:
      - internal

  auth-service-db:
    image: mysql:latest
    container_name: auth-service-db

    ports:
      - "5001:3306"

    environment:
      MYSQL_DATABASE: patientdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: password

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 5

#    volumes:
#      - "E:/db_volumes/auth-service-db:/var/lib/mysql"

    networks:
      - internal

  patient-service:
    build:
       context: ./patient-service
       dockerfile: Dockerfile

    container_name: patient-service

    environment:
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:mysql://patient-service-db:3306/patientdb
      SPRING_DATASOURCE_USERNAME: admin_user

      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_SQL_INIT_MODE: always

    ports:
      - "4000:4000"

    networks:
      - internal

    depends_on:
      - patient-service-db
      - kafka
      - billing-service

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile

    container_name: billing-service

    ports:
      - "4001:4001"
      - "9001:9001"

    networks:
      - internal

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "4004:4004"

    networks:
      - internal

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    container_name: analytics-service

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "4002:4002"

    networks:
      - internal

    depends_on:
      - kafka

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

    networks:
      - internal

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: auth-service

    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-service-db:3306/patientdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: pkNTiKDBphfVmg2Fctuy44ZvDYopBsylxvZajiZeOZ2

    ports:
      - "4005:4005"

    networks:
      - internal

    depends_on:
      auth-service-db:
        condition: service_healthy

networks:
  internal:
    driver: bridge


